<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>✨ 生日祝福 · 天天开心 ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0a0f1e 0%, #1a1f30 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      position: relative;
    }

    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap');

    #starCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .birthday-card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 800px;
      padding: 3rem 2rem;
      background: rgba(20, 25, 45, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 60px 20px 60px 20px;
      border: 1px solid rgba(255, 220, 180, 0.25);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 200, 150, 0.15) inset;
      text-align: center;
      transition: transform 0.3s ease;
      animation: cardFloat 6s infinite alternate ease-in-out;
    }

    @keyframes cardFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      z-index: -1;
    }

    .glow-1 {
      width: 300px;
      height: 300px;
      background: #f9c978;
      top: -100px;
      left: -100px;
      animation: pulse 8s infinite alternate;
    }

    .glow-2 {
      width: 400px;
      height: 400px;
      background: #b8a9ff;
      bottom: -150px;
      right: -120px;
      opacity: 0.3;
      animation: pulse 10s infinite alternate-reverse;
    }

    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.5; transform: scale(1.2); }
    }

    .greeting {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 6px;
      color: #f0e9d8;
      text-shadow: 0 0 15px rgba(255, 215, 150, 0.7);
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeInUp 1.5s 0.2s forwards;
    }

    /* “天天开心” 清晰锐利，无模糊 */
    .main-wish {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 0.5rem 0 0.2rem 0;
      background: linear-gradient(135deg, #ffe6b0, #ffc3a0, #ffa07a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 1px rgba(255, 200, 120, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
      letter-spacing: 8px;
      display: flex;
      justify-content: center;
      gap: 0.05em;
      opacity: 0;
      animation: fadeInUp 1.5s 0.6s forwards, gentleGlow 4s infinite alternate 1.8s;
    }

    @keyframes gentleGlow {
      0% { filter: drop-shadow(0 0 2px rgba(255, 220, 150, 0.4)); }
      100% { filter: drop-shadow(0 0 8px rgba(255, 230, 180, 0.6)); }
    }

    .char {
      display: inline-block;
      animation: charFloat 3s infinite ease-in-out;
    }

    .char:nth-child(1) { animation-delay: 0s; }
    .char:nth-child(2) { animation-delay: 0.2s; }
    .char:nth-child(3) { animation-delay: 0.4s; }
    .char:nth-child(4) { animation-delay: 0.6s; }

    @keyframes charFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .sub-wish {
      font-size: 1.3rem;
      font-weight: 300;
      color: #d9d0c0;
      letter-spacing: 4px;
      margin-top: 0.8rem;
      opacity: 0;
      animation: fadeInUp 1.5s 1s forwards;
      text-shadow: 0 0 15px rgba(180, 200, 255, 0.5);
    }

    .cake-icon {
      font-size: 2.8rem;
      margin-top: 1.2rem;
      opacity: 0;
      animation: fadeInUp 1.5s 1.2s forwards;
      filter: drop-shadow(0 0 12px #ffb56b);
    }

    .hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 245, 220, 0.5);
      font-size: 0.9rem;
      letter-spacing: 2px;
      z-index: 20;
      pointer-events: none;
      animation: hintBlink 3s infinite;
    }

    @keyframes hintBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    /* 烟花粒子样式 */
    .firework-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: fireworkBurst 1.6s ease-out forwards;
      filter: blur(0.5px);
    }

    @keyframes fireworkBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.2);
      }
    }

    /* 治愈文案样式 */
    .healing-text {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff5e0;
      text-shadow: 0 0 12px rgba(255, 200, 120, 0.9), 0 0 24px rgba(255, 150, 80, 0.5);
      letter-spacing: 2px;
      white-space: nowrap;
      animation: textFloatUp 2.2s ease-out forwards;
      padding: 0.4rem 1rem;
      background: rgba(30, 25, 50, 0.4);
      border-radius: 40px;
      border: 1px solid rgba(255, 220, 180, 0.3);
      backdrop-filter: blur(4px);
    }

    @keyframes textFloatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(0) scale(0.7);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(-10px) scale(1);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-70px) scale(1.05);
      }
    }

    body {
      cursor: crosshair;
    }

    @media (max-width: 600px) {
      .birthday-card {
        padding: 2rem 1.2rem;
        border-radius: 40px 15px 40px 15px;
      }
      .main-wish {
        font-size: 4.2rem;
        letter-spacing: 5px;
      }
      .greeting {
        font-size: 1.2rem;
        letter-spacing: 4px;
      }
      .sub-wish {
        font-size: 1rem;
        letter-spacing: 2px;
      }
      .cake-icon {
        font-size: 2rem;
      }
      .healing-text {
        font-size: 0.9rem;
        padding: 0.3rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="birthday-card">
    <div class="greeting">HAPPY BIRTHDAY</div>
    <div class="main-wish">
      <span class="char">天</span>
      <span class="char">天</span>
      <span class="char">开</span>
      <span class="char">心</span>
    </div>
    <div class="sub-wish">✨ 愿你的每一天都充满阳光 ✨</div>
    <div class="cake-icon">🎂🎈🎁</div>
  </div>

  <div class="hint">轻触屏幕，绽放烟花 🎆</div>

  <script>
    (function() {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let stars = [];
      let shootingStars = [];
      const STAR_COUNT = 220;

      // 治愈文案库
      const healingMessages = [
        '你值得被世界温柔以待',
        '慢慢来，一切都会变好',
        '今天的你也很棒呀',
        '愿你眼里有光，心中有暖',
        '生活明朗，万物可爱',
        '每一个今天都值得庆祝',
        '你笑起来真好看',
        '愿你所求皆如愿',
        '万物皆有裂痕，那是光照进来的地方',
        '做自己的太阳，无需凭借谁的光',
        '愿你成为自己的骄傲',
        '心之所向，皆是美好',
        '不必完美，你已足够好',
        '愿你与幸运撞个满怀',
        '岁月漫长，你心地善良',
        '一切美好正在向你奔来',
        '今天也要好好爱自己',
        '你是这世间独一无二的珍宝',
        '愿你的世界永远有光',
        '所有热爱的事情都要不遗余力',
      ];

      // 烟花颜色
      const fireworkColors = [
        '#ffd966', '#ff9a9e', '#a18cd1', '#fbc2eb', '#84fab0',
        '#8fd3f4', '#f6d365', '#fda085', '#ffecd2', '#fcb69f',
        '#a1c4fd', '#c2e9fb', '#ffb347', '#ff6b6b', '#feca57',
      ];

      function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.8 + 0.3,
            alpha: Math.random() * 0.7 + 0.3,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            phase: Math.random() * Math.PI * 2,
            color: Math.random() > 0.8 ? '#ffe0b0' : (Math.random() > 0.7 ? '#c0d0ff' : '#ffffff')
          });
        }
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initStars();
      }

      window.addEventListener('resize', resizeCanvas);

      function drawStars() {
        ctx.clearRect(0, 0, width, height);

        stars.forEach(star => {
          star.phase += star.twinkleSpeed;
          const twinkle = Math.sin(star.phase) * 0.3 + 0.7;
          const alpha = star.alpha * twinkle;

          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fillStyle = star.color;
          ctx.globalAlpha = alpha;
          ctx.fill();

          if (star.radius > 1.2) {
            ctx.shadowColor = star.color;
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        });

        ctx.globalAlpha = 1.0;

        // 流星 —— 速度放慢，更从容优雅
        shootingStars = shootingStars.filter(s => {
          s.x += s.vx;
          s.y += s.vy;
          s.alpha -= 0.004;  // 消失更慢
          s.life -= 1;

          if (s.alpha <= 0 || s.life <= 0 || s.x > width + 300 || s.y > height + 300) {
            return false;
          }

          const tailLength = 12;
          const tailX = s.x - s.vx * tailLength;
          const tailY = s.y - s.vy * tailLength;

          const gradient = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
          gradient.addColorStop(0, `rgba(255, 255, 240, ${s.alpha})`);
          gradient.addColorStop(0.4, `rgba(255, 220, 150, ${s.alpha * 0.9})`);
          gradient.addColorStop(1, `rgba(255, 180, 100, 0)`);

          ctx.beginPath();
          ctx.strokeStyle = gradient;
          ctx.lineWidth = s.size * 2.2;
          ctx.lineCap = 'round';
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * 1.8, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 230, ${s.alpha})`;
          ctx.shadowColor = '#ffd966';
          ctx.shadowBlur = 30;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * 1.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
          ctx.shadowBlur = 40;
          ctx.fill();

          ctx.shadowBlur = 0;

          return true;
        });

        requestAnimationFrame(drawStars);
      }

      // 生成流星 —— 速度大幅放慢
      function spawnShootingStar() {
        if (shootingStars.length < 5) {
          const angle = Math.random() * Math.PI / 4 + Math.PI / 6;
          const speed = Math.random() * 3 + 2.5;   // 原来是 9-19，现在放慢到 2.5-5.5
          const baseSize = Math.random() * 2.3 + 1.5;
          shootingStars.push({
            x: Math.random() * width * 0.9,
            y: Math.random() * height * 0.5,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: baseSize,
            alpha: 1,
            life: 260                                 // 生命周期更长，配合慢速
          });
        }
        setTimeout(spawnShootingStar, Math.random() * 2000 + 1200);
      }

      resizeCanvas();
      drawStars();
      setTimeout(spawnShootingStar, 300);
      setTimeout(() => {
        if (shootingStars.length < 2) {
          const angle = Math.random() * Math.PI / 3 + Math.PI / 6;
          const speed = Math.random() * 2 + 3;
          shootingStars.push({
            x: Math.random() * width * 0.7,
            y: Math.random() * height * 0.3,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 2 + 2.5,
            alpha: 1,
            life: 280
          });
        }
      }, 200);

      // ---------- 烟花特效 ----------
      function createFirework(x, y) {
        // 粒子数量 28-40，视觉效果更丰富
        const particleCount = Math.floor(Math.random() * 13) + 28;
        const baseColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
        
        // 也可以生成两色混合烟花
        const secondColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
        const useSecondColor = Math.random() > 0.5;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'firework-particle';
          
          // 随机角度和距离
          const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.5;
          const distance = Math.random() * 120 + 60;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          
          // 粒子大小随机
          const size = Math.random() * 5 + 3;
          
          // 颜色选择
          const color = useSecondColor && i % 2 === 0 ? secondColor : baseColor;
          
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.background = color;
          particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
          particle.style.setProperty('--tx', tx + 'px');
          particle.style.setProperty('--ty', ty + 'px');
          // 随机动画时长，让烟花更有层次
          particle.style.animationDuration = (Math.random() * 0.6 + 1.2) + 's';
          
          document.body.appendChild(particle);

          setTimeout(() => {
            if (particle.parentNode) {
              particle.remove();
            }
          }, 2000);
        }
      }

      // 显示治愈文案
      function showHealingText(x, y) {
        const text = healingMessages[Math.floor(Math.random() * healingMessages.length)];
        const el = document.createElement('div');
        el.className = 'healing-text';
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        // 随机水平偏移，避免叠加
        el.style.marginLeft = (Math.random() - 0.5) * 80 + 'px';
        
        document.body.appendChild(el);

        setTimeout(() => {
          if (el.parentNode) {
            el.remove();
          }
        }, 2400);
      }

      function handleInteraction(e) {
        let clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
          e.preventDefault();
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        // 绽放烟花
        createFirework(clientX, clientY);
        
        // 显示治愈文案（稍微偏移一点，让烟花和文字都看得见）
        const textX = clientX + (Math.random() - 0.5) * 60;
        const textY = clientY - 20 - Math.random() * 30;
        showHealingText(textX, textY);
      }

      window.addEventListener('click', handleInteraction);
      window.addEventListener('touchstart', handleInteraction, { passive: false });

      window.addEventListener('resize', () => {
        resizeCanvas();
      });
    })();
  </script>

  <style>
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, rgba(255, 220, 150, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(200, 180, 255, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    .birthday-card::after {
      content: '✦';
      position: absolute;
      top: 10px;
      right: 30px;
      font-size: 1.5rem;
      color: rgba(255, 230, 170, 0.5);
      animation: floatStar 5s infinite alternate ease-in-out;
      text-shadow: 0 0 15px #ffd966;
      pointer-events: none;
    }

    .birthday-card::before {
      content: '✧';
      position: absolute;
      bottom: 15px;
      left: 25px;
      font-size: 2rem;
      color: rgba(200, 220, 255, 0.5);
      animation: floatStar 7s infinite alternate-reverse ease-in-out;
      text-shadow: 0 0 20px #aad0ff;
      pointer-events: none;
    }

    @keyframes floatStar {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
      100% { transform: translate(12px, -18px) rotate(15deg); opacity: 0.9; }
    }
  </style>
</body>
</html>
